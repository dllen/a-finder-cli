</head>

<main class="container py-4">
  <div class="page-header">
    <h1 class="h3 mb-0 page-title">交易计划 <span class="badge bg-secondary align-middle">paper</span></h1>
  </div>

  <div id="dashboard"></div>

  <div class="filter-toolbar">
    <div class="date-filter"
     data-date-filter data-select-id="d">
  <label class="date-filter__label" for="d">日期</label>
  <div class="date-filter__control">
    <button type="button" class="date-filter__step" data-step="-1"
            aria-label="前一交易日" aria-controls="d" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M10 12 6 8l4-4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="date-filter__field">
      <select id="d" class="form-select date-filter__select"></select>
    </div>
    <button type="button" class="date-filter__step" data-step="1"
            aria-label="后一交易日" aria-controls="d" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <button type="button" class="date-filter__latest" hidden>回到最新</button>
  <span class="date-filter__status" role="status" aria-live="polite"></span>
</div>
    <div class="filter-group">
      <label class="form-label" for="capital-group">资金</label>
      <div id="capital-group" class="btn-group btn-group-sm flex-wrap" role="group" aria-label="资金档位">
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="50000">5W</button>
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="100000">10W</button>
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="150000">15W</button>
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="200000">20W</button>
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="250000">25W</button>
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="300000">30W</button>
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="350000">35W</button>
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="400000">40W</button>
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="450000">45W</button>
        
        <button type="button" class="btn btn-outline-primary capital-btn" data-capital="500000">50W</button>
        
      </div>
    </div>
    <div class="filter-group">
      <label class="form-label d-inline-block align-baseline mb-0">档位筛选（交集）</label>
      <button type="button" id="tier-filter-help" class="btn btn-link btn-sm p-0 ms-1 align-baseline"
              data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-html="true"
              data-bs-placement="right"
              data-bs-title="档位筛选（交集）"
              data-bs-content="勾选多档时，只保留在 <b>所有</b> 选中档位下都能建仓的票。空选 = 不限。"
              aria-label="档位筛选说明">?</button>
      <div class="dropdown d-inline-block ms-1" id="tier-filter-dd">
        <button id="tier-filter-btn" class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <span id="tier-filter-label">不限</span>
        </button>
        <ul class="dropdown-menu p-2" aria-labelledby="tier-filter-btn"><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="50000"> 5W</label></li><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="100000"> 10W</label></li><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="150000"> 15W</label></li><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="200000"> 20W</label></li><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="250000"> 25W</label></li><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="300000"> 30W</label></li><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="350000"> 35W</label></li><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="400000"> 40W</label></li><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="450000"> 45W</label></li><li><label class="dropdown-item"><input type="checkbox" class="form-check-input me-1 tier-filter-cb" value="500000"> 50W</label></li></ul>
      </div>
    </div>
    <input id="q" type="search" class="form-control" placeholder="筛选：代码 / 名称" aria-label="快速筛选">
    
    <div class="form-check"><input id="only-affordable" type="checkbox" class="form-check-input">
      <label for="only-affordable" class="form-check-label">只显示可建仓</label></div>
  </div>

  <div id="status" class="mb-3"></div>
<div id="prog" class="mb-3"></div>
<div id="log" class="mb-3"></div>
  <div id="board"></div>

  <h2 class="section-title mt-4">持仓跟踪</h2>
  <div id="holdings"></div>
</main>

<footer class="app-footer">
<div class="container d-flex flex-column flex-md-row justify-content-between align-items-center py-3 gap-1">

</div>

</html>
