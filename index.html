<main class="container page" id="main">
<header class="sheet-head">
<h1 class="sheet-date"><span class="visually-hidden">每日机会，交易日 </span><time id="sheet-date" datetime="2026-11-06">2026-11-06</time></h1>
<div id="dashboard" class="records"></div>
</header>


<div class="toolbar">
<div class="date-filter"
     data-date-filter data-select-id="d">
  <label class="date-filter__label" for="d">日期</label>
  <div class="date-filter__control">
    <button type="button" class="date-filter__step" data-step="-1"
            aria-label="前一交易日" aria-controls="d" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M10 12 6 8l4-4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="date-filter__field">
      <select id="d" class="date-filter__select"></select>
    </div>
    <button type="button" class="date-filter__step" data-step="1"
            aria-label="后一交易日" aria-controls="d" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <button type="button" class="date-filter__latest" hidden>回到最新</button>
  <span class="date-filter__status" role="status" aria-live="polite"></span>
</div>
<div class="field field--search">
<label class="visually-hidden" for="q">筛选榜单</label>
<input id="q" type="search" class="input" placeholder="筛选：代码、名称或策略" autocomplete="off">
</div>
<div class="toolbar__sort">
<label class="visually-hidden" for="sort-select">排序</label>
<select id="sort-select" class="sort-select">
<option value="score:-1">评分 高到低</option>
<option value="ret_pct:-1">涨跌% 高到低</option>
<option value="buy:-1">买入价 高到低</option>
<option value="stop:-1">止损价 高到低</option>
<option value="target:-1">目标价 高到低</option>
<option value="code:1">代码 升序</option>
</select>
</div>

</div>
<div id="status" class="status"></div>
<div id="prog" class="prog"></div>
<div id="log" class="log"></div>

<div id="board" class="board"></div>

<section class="stats" aria-labelledby="stats-title">
<div class="section-head">
<h2 id="stats-title">策略胜率统计</h2>
<p class="section-note">基于历史标注样本</p>
</div>
<div id="stats"></div>
</section>
</main>

<footer class="app-footer">
<div class="container app-footer__inner">
<p class="app-footer__brand">&copy; 2026 每日机会</p>
<p class="app-footer__note">沪深300 选股与可转债分析</p>
<p class="app-footer__note">数据仅供参考，不构成投资建议</p>
</div>
</footer>

<div class="modal fade" id="tipModal" tabindex="-1" aria-labelledby="tipModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="tipModalLabel">赞赏支持</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <p class="tip-lede">如果这个站点对你有帮助，可以扫码赞赏一杯咖啡。纯属自愿，不影响任何功能。</p>
        <div class="tip-switch">
          <input class="tip-switch__input" type="radio" name="tip-channel" id="tip-alipay" checked>
          <label class="tip-switch__label" for="tip-alipay">支付宝</label>
          <input class="tip-switch__input" type="radio" name="tip-channel" id="tip-wechat">
          <label class="tip-switch__label" for="tip-wechat">微信支付</label>
          <div class="row g-3 text-center tip-panes">
            <div class="col-12 col-sm-6 tip-pane tip-pane--alipay">
              <a class="tip-qr-link" href="static/images/alipay-qr.jpeg?v=7c3c4f1" target="_blank" rel="noopener" aria-label="打开支付宝收款码原图">
                <img src="static/images/alipay-qr.jpeg?v=7c3c4f1" class="tip-qr" alt="支付宝收款码"
                     width="1156" height="1156" loading="lazy" decoding="async">
              </a>
              <p class="tip-label">支付宝</p>
              <p class="tip-caption">支付宝扫一扫</p>
              <p class="tip-actions">
                <a class="btn btn--sm" href="static/images/alipay-qr.jpeg?v=7c3c4f1" download="alipay-qr.jpeg">保存图片</a>
                <a class="btn btn--sm btn--quiet" href="static/images/alipay-qr.jpeg?v=7c3c4f1" target="_blank" rel="noopener">看原图</a>
              </p>
            </div>
            <div class="col-12 col-sm-6 tip-pane tip-pane--wechat">
              <a class="tip-qr-link" href="static/images/wechat-qr.jpeg?v=7c3c4f1" target="_blank" rel="noopener" aria-label="打开微信收款码原图">
                <img src="static/images/wechat-qr.jpeg?v=7c3c4f1" class="tip-qr" alt="微信支付收款码"
                     width="387" height="387" loading="lazy" decoding="async">
              </a>
              <p class="tip-label">微信支付</p>
              <p class="tip-caption">微信扫一扫</p>
              <p class="tip-actions">
                <a class="btn btn--sm" href="static/images/wechat-qr.jpeg?v=7c3c4f1" download="wechat-qr.jpeg">保存图片</a>
                <a class="btn btn--sm btn--quiet" href="static/images/wechat-qr.jpeg?v=7c3c4f1" target="_blank" rel="noopener">看原图</a>
              </p>
            </div>
          </div>
        </div>
        <p class="tip-caption tip-hint">电脑可直接扫码；手机点「保存图片」存到相册，或长按图片保存，再到支付宝或微信的扫一扫里从相册选择。</p>
      </div>
    </div>
  </div>
</div>
