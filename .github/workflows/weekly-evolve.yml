name: weekly-evolve

on:
  schedule:
    # 周五 16:30（北京时间），当日 daily-sync 出完 pick 后跑进化闭环
    - cron: "30 8 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore hs300.db from cache
        uses: actions/cache@v4
        with:
          path: hs300.db
          key: hs300-db-${{ github.run_id }}
          restore-keys: |
            hs300-db-

      - name: Run strategy evolution
        id: evolve
        run: python stock_cli.py evolve --db hs300.db

      - name: 检查库是否仍是合格的谱系根
        id: verify
        if: always()
        run: |
          set -uo pipefail
          # 谱系根资格：库里有行情，且最新日不落后太多。
          # 为什么加这道守卫：restore-keys 取**最新**的匹配条目，谁最后保存谁就是
          # 下一个 run 的起点。这个 workflow 原来保存缓存时**完全没有 if 守卫**，
          # 一次失败的 evolve（或一个本来就陈旧的库）都会成为谱系根，缺口被固化
          # 并逐日传递 —— 2026-10-29 查明 CI 行情谱系断在 2026-10-13 就是这么来的。
          # 「落后太多」用交易日算，不用自然日：周末不该算落后。
          python3 - <<'PY'
          import datetime as dt, sqlite3, sys
          from pathlib import Path
          from market_calendar import trading_days

          db = Path("hs300.db")
          if not db.exists():
              print("::error::缓存里没有 hs300.db，不保存缓存（避免把坏库当谱系根）")
              sys.exit(1)
          try:
              conn = sqlite3.connect("hs300.db")
              row = conn.execute("SELECT MAX(trade_date) FROM daily_prices").fetchone()
              latest = row[0] if row else None
              conn.close()
          except Exception as exc:
              print(f"::error::读 daily_prices 失败: {exc}")
              sys.exit(1)
          if not latest:
              print("::error::daily_prices 为空，不保存缓存（空库当谱系根会清空后继 run）")
              sys.exit(1)
          # 历史深度也要看（2026-11-01 加）：一条「最新日很新但历史只有几十天」的库
          # 算不出选股（pick_history 按每只票的 K 线根数过滤，min_days=221），
          # 站点会停在旧日期 —— 而它却是 restore-keys 命中「最新条目」的那一条，
          # 会把短历史谱系传给所有后继 run。与「最新日」是独立的两个维度。
          conn_bars = sqlite3.connect("hs300.db")
          try:
              bars_row = conn_bars.execute(
                  "SELECT MAX(n) FROM (SELECT COUNT(*) n FROM daily_prices GROUP BY code)"
              ).fetchone()
              bars = bars_row[0] if bars_row and bars_row[0] is not None else 0
          finally:
              conn_bars.close()
          print(f"历史深度 {bars} 根 K 线")
          if bars < 221:
              print(f"::error::历史深度只有 {bars} 根（需 >= 221，否则算不出选股），"
                    "不保存为谱系根")
              sys.exit(1)
          today = dt.date.today()
          window = trading_days(today - dt.timedelta(days=14), today)
          lag = len([d for d in window if d > latest])
          print(f"行情最新日 {latest}，落后 {lag} 个交易日")
          # 要求**严格最新**（lag == 0），不是「落后不超过 3 天」。
          # 为什么：本 workflow 与 deploy-site 都在周五 08:30 UTC 跑，如果它恢复到的
          # 是「deploy-site 本轮还没保存」的旧缓存，它保存的库就**比恢复到的那个更旧或相同**。
          # 而 restore-keys 取最新条目 → 这个旧库会变成下一个 run 的起点，把谱系**倒退**
          # 1~3 天。一个严格比手上更差的库，永远不该成为最新的谱系根。
          if lag > 0:
              print(f"::error::库落后 {lag} 个交易日（要求 0），不保存为谱系根")
              sys.exit(1)
          print("库是最新的，可以作为谱系根")
          PY

      # 存缓存**之前**先把库瘦身（2026-11-04 加）。
      # 理由见 deploy-site.yml 的同名步骤：trade_plan（含索引）469 MB / 全库 499 MB，
      # 一天 8 班 × 全量库会打爆 actions/cache 的 10 GB 配额，
      # 而 actions/cache **存不下但不报错** ⇒ 谱系停在最后一次成功保存的那天。
      # trade_plan 是派生表（daily_picks + daily_prices 可重算），只删它、不碰行情。
      - name: 瘦身库（缓存配额有限，trade_plan 是派生表可重算）
        id: slim
        if: always()
        run: |
          set -uo pipefail
          # ⚠️ **必须原地瘦身**（不加 --out），保持文件名仍是 hs300.db。
          # actions/cache 按归档里的路径还原：存 hs300.db.slim 而 restore 写
          # path: hs300.db ⇒ 还原出 hs300.db.slim，下游找 hs300.db 找不到 ⇒ 每班冷启动。
          if python3 scripts/slim_db_for_cache.py --db hs300.db; then
            echo "slim_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "slim_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::瘦身失败 —— 仍存原库（可能撑爆缓存配额）"
          fi

      - name: Save hs300.db to cache（只让「合格」的库当谱系根）
        if: always()
        uses: actions/cache@v4
        with:
          # 必须与 restore 的 path 一致（都是 hs300.db）；瘦身已在上一歩原地完成。
          path: hs300.db
          # 合格 → hs300-db-<run_id>（下一个 run 从它继续）；
          # 不合格 → degraded-hs300-db-<run_id>（**必须不以 hs300-db- 开头**，
          # 否则 restore-keys 仍然命中它，等于没隔离；留作事后排查用）。
          key: ${{ steps.verify.outcome == 'success' && format('hs300-db-{0}', github.run_id) || format('degraded-hs300-db-{0}', github.run_id) }}
