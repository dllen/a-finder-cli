name: weekly-evolve

on:
  schedule:
    # 周五 16:30（北京时间），当日 daily-sync 出完 pick 后跑进化闭环
    - cron: "30 8 * * 5"
  workflow_dispatch:

permissions:
  # 2026-11-04：谱系改成 GitHub Release 资产，上传/删除资产需要 contents: write
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ⚠️ 2026-11-04 起不再用 actions/cache（它在本仓库双向都不工作：
      # Post Save / Post Restore 一直 skipped，条目停在 10-27/10-29 两条 5.2MB 残库）。
      # 改成 GitHub Release 资产，见 scripts/db_lineage.py。
      - name: Restore hs300.db from 谱系 release（不用 actions/cache）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          python3 scripts/db_lineage.py restore --db hs300.db || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::notice::没有可用谱系，按冷启动处理"
            else
              echo "::warning::谱系恢复出错（rc=$rc），按冷启动处理"
            fi
            rm -f hs300.db
          }

      - name: Run strategy evolution
        id: evolve
        run: python stock_cli.py evolve --db hs300.db

      - name: 检查库是否仍是合格的谱系根
        id: verify
        if: always()
        run: |
          set -uo pipefail
          # 谱系根资格：库里有行情，且最新日不落后太多。
          # 为什么加这道守卫：restore-keys 取**最新**的匹配条目，谁最后保存谁就是
          # 下一个 run 的起点。这个 workflow 原来保存缓存时**完全没有 if 守卫**，
          # 一次失败的 evolve（或一个本来就陈旧的库）都会成为谱系根，缺口被固化
          # 并逐日传递 —— 2026-10-29 查明 CI 行情谱系断在 2026-10-13 就是这么来的。
          # 「落后太多」用交易日算，不用自然日：周末不该算落后。
          python3 - <<'PY'
          import datetime as dt, sqlite3, sys
          from pathlib import Path
          from market_calendar import trading_days

          db = Path("hs300.db")
          if not db.exists():
              print("::error::缓存里没有 hs300.db，不保存缓存（避免把坏库当谱系根）")
              sys.exit(1)
          try:
              conn = sqlite3.connect("hs300.db")
              row = conn.execute("SELECT MAX(trade_date) FROM daily_prices").fetchone()
              latest = row[0] if row else None
              conn.close()
          except Exception as exc:
              print(f"::error::读 daily_prices 失败: {exc}")
              sys.exit(1)
          if not latest:
              print("::error::daily_prices 为空，不保存缓存（空库当谱系根会清空后继 run）")
              sys.exit(1)
          # 历史深度也要看（2026-11-01 加）：一条「最新日很新但历史只有几十天」的库
          # 算不出选股（pick_history 按每只票的 K 线根数过滤，min_days=221），
          # 站点会停在旧日期 —— 而它却是 restore-keys 命中「最新条目」的那一条，
          # 会把短历史谱系传给所有后继 run。与「最新日」是独立的两个维度。
          conn_bars = sqlite3.connect("hs300.db")
          try:
              bars_row = conn_bars.execute(
                  "SELECT MAX(n) FROM (SELECT COUNT(*) n FROM daily_prices GROUP BY code)"
              ).fetchone()
              bars = bars_row[0] if bars_row and bars_row[0] is not None else 0
          finally:
              conn_bars.close()
          print(f"历史深度 {bars} 根 K 线")
          if bars < 221:
              print(f"::error::历史深度只有 {bars} 根（需 >= 221，否则算不出选股），"
                    "不保存为谱系根")
              sys.exit(1)
          today = dt.date.today()
          window = trading_days(today - dt.timedelta(days=14), today)
          lag = len([d for d in window if d > latest])
          print(f"行情最新日 {latest}，落后 {lag} 个交易日")
          # 要求**严格最新**（lag == 0），不是「落后不超过 3 天」。
          # 为什么：本 workflow 与 deploy-site 都在周五 08:30 UTC 跑，如果它恢复到的
          # 是「deploy-site 本轮还没保存」的旧缓存，它保存的库就**比恢复到的那个更旧或相同**。
          # 而 restore-keys 取最新条目 → 这个旧库会变成下一个 run 的起点，把谱系**倒退**
          # 1~3 天。一个严格比手上更差的库，永远不该成为最新的谱系根。
          if lag > 0:
              print(f"::error::库落后 {lag} 个交易日（要求 0），不保存为谱系根")
              sys.exit(1)
          print("库是最新的，可以作为谱系根")
          PY

      # 存**谱系之前**先把库瘦身（2026-11-04 加）。
      # 理由见 deploy-site.yml 的同名步骤：trade_plan（含索引）占全库 94%，而它是
      # 派生表（daily_picks + daily_prices 可重算）⇒ 只删它、不碰行情。
      - name: 瘦身库（trade_plan 是派生表，可重算）
        id: slim
        if: always()
        run: |
          set -uo pipefail
          # ⚠️ **必须原地瘦身**（不加 --out），文件名保持 hs300.db（下游都按它找库）。
          if python3 scripts/slim_db_for_cache.py --db hs300.db; then
            echo "slim_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "slim_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::瘦身失败 —— 仍存原库（上传更大但不会丢数据）"
          fi

      - name: 保存谱系到 release（只让「合格」的库当谱系根）
        id: save_lineage
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 资格由上一个「检查库是否仍是合格的谱系根」步骤决定：
          # steps.verify.outcome == success ⇒ 合格。不合格时**绝不覆盖**谱系根
          # （等价于原来 cache 方案的 degraded- 前缀隔离）。
          OK="false"
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            OK="true"
          fi
          python3 scripts/db_lineage.py save --db hs300.db --lineage-ok "$OK"
