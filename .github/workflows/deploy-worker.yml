name: deploy-worker

# Cloudflare Worker（/api/decide/* 持仓云端化）自动部署。
# 触发：worker/** 或 wrangler.toml 改动推送到 main；或手动 workflow_dispatch。
# 与 scripts/deploy-worker.sh 等价，但无交互：secrets 从 GitHub Secrets 注入。
#
# 需要的 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   — 含 Workers Scripts:Edit + D1:Edit 权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 账户 ID
# 可选（存在则同步到 Worker，用于轮换凭据；不设置则沿用 Cloudflare 侧已有值）：
#   DECIDE_USER / DECIDE_PASSWORD / DECIDE_SECRET
#   GITHUB_DISPATCH_TOKEN — Cron 兜底触发 deploy-site 用的 fine-grained PAT
#                           （仅授权本仓库 Actions: Read and write）
# 注意：wrangler deploy 不会删除 Worker 上已存在的 secrets，
#       所以平时部署无需提供 DECIDE_*；仅在新建/轮换时配置。
#       若配置了 DECIDE_USER/PASSWORD，自检会额外做登录回环检查（错误凭据 401、
#       正确凭据 200 + authed=true）；未配置则跳过该检查，不算失败。

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 前置检查（database_id 已配置）
        run: |
          if grep -q "REPLACE_WITH_D1_DATABASE_ID" wrangler.toml; then
            echo "::error::wrangler.toml 的 database_id 还是占位符"
            exit 1
          fi

      - name: 验证 Cloudflare 凭据（whoami）
        run: |
          # 先显式报缺哪个 secret，再用 whoami 验证 token 有效性（失败即 10000 认证错误）
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || { echo "::error::缺少 GitHub Secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::缺少 GitHub Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx --yes wrangler@latest whoami

      - name: 建表（D1，幂等）
        run: npx --yes wrangler@latest d1 execute a-finder --file=worker/schema.sql --remote --yes

      - name: 同步 DECIDE_* secrets（可选）
        env:
          DECIDE_USER: ${{ secrets.DECIDE_USER }}
          DECIDE_PASSWORD: ${{ secrets.DECIDE_PASSWORD }}
          DECIDE_SECRET: ${{ secrets.DECIDE_SECRET }}
        run: |
          # 三个值都非空才推送；空 stdin 会被 wrangler 静默写成空 secret（已知 bug），必须守卫
          if [ -z "$DECIDE_USER" ] && [ -z "$DECIDE_PASSWORD" ] && [ -z "$DECIDE_SECRET" ]; then
            echo "未配置 DECIDE_* GitHub Secrets，跳过（沿用 Cloudflare 侧已有值）"
            exit 0
          fi
          if [ -z "$DECIDE_USER" ] || [ -z "$DECIDE_PASSWORD" ] || [ -z "$DECIDE_SECRET" ]; then
            echo "::error::DECIDE_USER / DECIDE_PASSWORD / DECIDE_SECRET 必须同时设置或同时不设置"
            exit 1
          fi
          printf '%s' "$DECIDE_USER"     | npx --yes wrangler@latest secret put DECIDE_USER
          printf '%s' "$DECIDE_PASSWORD" | npx --yes wrangler@latest secret put DECIDE_PASSWORD
          printf '%s' "$DECIDE_SECRET"   | npx --yes wrangler@latest secret put DECIDE_SECRET
          echo "已同步 3 个 DECIDE_* secrets"

      - name: 同步 GITHUB_DISPATCH_TOKEN（可选）
        env:
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
        run: |
          # Cron 兜底触发 deploy-site 用的 PAT；不配置则 Worker 的 scheduled 只记日志不触发
          if [ -z "$GITHUB_DISPATCH_TOKEN" ]; then
            echo "::notice::未配置 GITHUB_DISPATCH_TOKEN，Cron 兜底 dispatch 不生效（GitHub schedule 仍为主）"
            exit 0
          fi
          printf '%s' "$GITHUB_DISPATCH_TOKEN" | npx --yes wrangler@latest secret put GITHUB_DISPATCH_TOKEN
          echo "已同步 GITHUB_DISPATCH_TOKEN"

      - name: 同步 SYNC_TOKEN（可选）
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # /api/market/* 的共享密钥；与 GH 侧的 D1_SYNC_TOKEN 必须是同一个值
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::notice::未配置 SYNC_TOKEN，/api/market/* 将始终返回 401"
            exit 0
          fi
          printf '%s' "$SYNC_TOKEN" | npx --yes wrangler@latest secret put SYNC_TOKEN
          echo "已同步 SYNC_TOKEN"

      - name: 部署 Worker
        run: npx --yes wrangler@latest deploy

      - name: 自检（health 需 d1 ok）
        env:
          DECIDE_USER: ${{ secrets.DECIDE_USER }}
          DECIDE_PASSWORD: ${{ secrets.DECIDE_PASSWORD }}
        run: |
          # 路由/CDN 生效有延迟，轮询最多 ~2 分钟
          body=""
          for i in $(seq 1 12); do
            body=$(curl -s --max-time 10 https://ycu.space/api/decide/health) && break
            echo "第 $i 次：health 尚未就绪，10s 后重试…"
            sleep 10
          done
          if [ -z "$body" ]; then
            echo "::error::health 请求持续失败（2 分钟）"
            exit 1
          fi
          echo "$body"
          echo "$body" | grep -q '"ok":true' || {
            echo "::error::health 返回 d1 异常"
            exit 1
          }
          echo "--- 未登录写入应 401 ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://ycu.space/api/decide/positions \
            -H 'Content-Type: application/json' \
            -d '{"code":"600519","shares":100,"entry_price":1500}')
          echo "HTTP $code"
          [ "$code" = "401" ] || { echo "::error::未登录写入应返回 401，实际 $code"; exit 1; }

          echo "--- 登录流程检查 ---"
          if [ -z "$DECIDE_USER" ] || [ -z "$DECIDE_PASSWORD" ]; then
            echo "::notice::未配置 DECIDE_USER/DECIDE_PASSWORD，跳过登录回环检查（health 已确认 d1 ok）"
            exit 0
          fi
          # 错误凭据应 401
          bad=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            https://ycu.space/api/decide/login \
            -H 'Content-Type: application/json' \
            -d '{"user":"nobody","password":"wrong"}')
          echo "错误凭据: HTTP $bad"
          [ "$bad" = "401" ] || { echo "::error::错误凭据应 401，实际 $bad"; exit 1; }
          # 正确凭据应 200 且 Set-Cookie，随后 health 应显示 authed=true
          jar=$(mktemp)
          good=$(curl -s -o /dev/null -w "%{http_code}" -c "$jar" -X POST \
            https://ycu.space/api/decide/login \
            -H 'Content-Type: application/json' \
            -d "{\"user\":\"$DECIDE_USER\",\"password\":\"$DECIDE_PASSWORD\"}")
          echo "正确凭据: HTTP $good"
          [ "$good" = "200" ] || { echo "::error::正确凭据应 200，实际 $good（Worker 上的 DECIDE_* 与 GitHub Secrets 不一致？）"; exit 1; }
          auth_body=$(curl -s -b "$jar" https://ycu.space/api/decide/health)
          echo "$auth_body"
          echo "$auth_body" | grep -q '"authed":true' || {
            echo "::error::登录后 health 应 authed=true（DECIDE_SECRET 不一致？）"
            exit 1
          }
          rm -f "$jar"
          echo "登录回环检查通过"
