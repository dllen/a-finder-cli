name: d1-backfill

# 把历史行情补进 Cloudflare D1。
#
# 为什么走 CI 而不是 Worker 回填：Worker Free 计划 CPU 只有 10ms，一轮抓多只就会超时
# （数据写进去了但游标不推进）；GitHub Actions 没有这个限制，且 CI 本来就有
# CLOUDFLARE_API_TOKEN 可以 wrangler d1 execute。
#
# 触发方式：改动本文件即自动跑（幂等，INSERT OR REPLACE），也可在 Actions 页手动 Run。
# 刻意不使用 workflow_dispatch inputs：push 触发时 inputs 为空对象，
# 在 run/if 里引用它曾导致工作流直接失败（本次排障踩过的坑）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-backfill.yml"
      - "scripts/seed_d1.py"

concurrency:
  group: d1-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore hs300.db from cache
        uses: actions/cache@v4
        with:
          path: hs300.db
          key: hs300-db-${{ github.run_id }}
          restore-keys: |
            hs300-db-

      - name: 计算日期区间
        id: range
        run: |
          END="$(TZ=Asia/Shanghai date +%F)"
          START="$(TZ=Asia/Shanghai date -d "${END} -760 days" +%F)"
          echo "start=${START}" >> "$GITHUB_OUTPUT"
          echo "end=${END}" >> "$GITHUB_OUTPUT"
          echo "区间：${START} ~ ${END}"

      - name: 抓历史行情进 SQLite（CI 可直连数据源）
        continue-on-error: true
        run: |
          echo "=== 抓取 ${{ steps.range.outputs.start }} ~ ${{ steps.range.outputs.end }} ==="
          python3 stock_cli.py sync-hs300-range \
            --start "${{ steps.range.outputs.start }}" \
            --end "${{ steps.range.outputs.end }}" \
            --db hs300.db \
            --concurrency 6 --rate 6 --retries 3 --backoff 0.8 2>&1 | tail -30
          python3 -c "import sqlite3;print('本地库:', sqlite3.connect('hs300.db').execute('SELECT COUNT(*), COUNT(DISTINCT trade_date), MIN(trade_date), MAX(trade_date) FROM daily_prices').fetchone())"

      - name: 生成 seed SQL
        run: |
          python3 scripts/seed_d1.py --db hs300.db --out /tmp/d1_backfill.sql \
            --since "${{ steps.range.outputs.start }}"
          ls -lh /tmp/d1_backfill.sql

      - name: 灌入 D1
        run: |
          npx --yes wrangler@latest d1 execute a-finder --file=/tmp/d1_backfill.sql --remote --yes

      - name: 清掉卡住的 Worker 回填任务
        continue-on-error: true
        run: |
          # Worker 回填受 10ms CPU 限制推进极慢，历史已由本 workflow 补齐
          npx --yes wrangler@latest d1 execute a-finder --remote --yes \
            --command "UPDATE sync_jobs SET status='done', note='superseded by d1-backfill' WHERE id LIKE 'backfill:%'"

      - name: 核对 D1 与本地库
        run: |
          echo "=== D1 ==="
          npx --yes wrangler@latest d1 execute a-finder --remote --yes \
            --command "SELECT COUNT(*) AS rows, COUNT(DISTINCT trade_date) AS days, MIN(trade_date) AS first, MAX(trade_date) AS last FROM market_prices"
          echo "=== 本地 ==="
          python3 -c "import sqlite3;print(sqlite3.connect('hs300.db').execute('SELECT COUNT(*), COUNT(DISTINCT trade_date), MIN(trade_date), MAX(trade_date) FROM daily_prices').fetchone())"

      - name: Save hs300.db to cache
        if: always()
        uses: actions/cache@v4
        with:
          path: hs300.db
          key: hs300-db-${{ github.run_id }}
