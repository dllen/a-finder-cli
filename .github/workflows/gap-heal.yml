name: gap-heal

# 每周体检 + 自愈 + 数据库备份。
#
# 1) 扫描最近 30 个交易日的行情覆盖，报告缺哪几天
# 2) 用 gap-fill 补抓（真实交易日历判定缺口，见 sync_service）
# 3) 再扫一次，仍有缺口则 workflow 变红（并把明细写进 summary）
# 4) 顺手把 hs300.db 压成 artifact（90 天保留）—— 缓存丢失时可快速恢复，不必重抓 400 天
#
# 触发：每周日 02:00 UTC（北京 10:00）、改动本文件/脚本、或手动 Run。
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gap-heal.yml"
      - "scripts/check_gaps.py"

concurrency:
  group: gap-heal
  cancel-in-progress: false

permissions:
  # 2026-11-04：谱系改成 GitHub Release 资产，上传/删除资产需要 contents: write
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ⚠️ 2026-11-04 起不再用 actions/cache（它在本仓库双向都不工作：
      # Post Save / Post Restore 一直 skipped，条目停在 10-27/10-29 两条 5.2MB 残库，
      # 于是 gap-heal 拿到空库 → 体检 30 天全 0 只、补抓后历史深度 0 根）。
      # 改成 GitHub Release 资产，见 scripts/db_lineage.py。
      - name: Restore hs300.db from 谱系 release（不用 actions/cache）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          python3 scripts/db_lineage.py restore --db hs300.db || {
            rc=$?
            if [ "$rc" = "2" ]; then
              echo "::notice::没有可用谱系，按冷启动处理"
            else
              echo "::warning::谱系恢复出错（rc=$rc），按冷启动处理"
            fi
            rm -f hs300.db
          }

      - name: 体检（补抓前）
        run: |
          if [ ! -f hs300.db ]; then
            echo "::warning::无缓存 DB，将走冷启动补抓"
            echo "## 体检：无本地库（冷启动）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          # ⚠️ 不要用 `| tee` 单独判 rc：rc 取的是 **tee** 的状态（恒 0），
          # 不是 check_gaps 的 ⇒ 「补抓前体检有没有缺口」这个判据一直是假的。
          # 这里先开 pipefail（见下方注释），rc 才真的是 check_gaps 的。
          set -o pipefail
          python3 scripts/check_gaps.py --db hs300.db --days 30 --min-codes 280 | tee /tmp/gaps_before.txt
          set +e
          rc=$?
          set -e
          { echo "## 体检（补抓前）"; echo '```'; cat /tmp/gaps_before.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "补抓前缺口退出码: $rc（1 = 有缺口，符合预期时会继续补抓）"

      - name: 补抓缺口（真实交易日历 + gap-fill）
        run: |
          set -uo pipefail
          END="$(TZ=Asia/Shanghai date +%F)"
          # ⚠️ 历史深度不够 ⇒ 必须**冷启动**（450 天），不能只补 90 天（2026-11-01 修）。
          # 为什么：gap-heal 只补「缺失的日期」，**历史长度不会增长**。而
          # `pick_history` 按**每只票的 K 线根数**过滤（min_days=221）——
          # 一条只存了最近几十天的库，最新日可以是最新的，但每只票都不够 221 根
          # → 0 只票 → 0 选股 → 导出没有新日期 → **站点停在旧日期**。
          # 实测（2026-11-01）：CI 缓存库只有 54 个交易日，站点卡在 10-29，
          # 而行情其实已同步到 10-30。
          #
          # 90 天窗口补完后仍不到 221 根 ⇒ 说明这条谱系从来没冷启动过 ⇒ 用 450 天重建。
          # ⚠️ 450 而不是 400：2026-11-05 实测 400 天（2025-11-05 起）只拿到
          # **216 根** < 221 门槛 ⇒ 永远判「陈旧谱系」⇒ 谱系永远推不动。
          # 从 2025-10-26 起（374 天）实测 **222 根** ✓。
          HISTORY_BARS=$(python3 -c "import sqlite3,pathlib,sys; p=pathlib.Path(sys.argv[1]); print((sqlite3.connect(p).execute('SELECT MAX(n) FROM (SELECT COUNT(*) n FROM daily_prices GROUP BY code)').fetchone() or [0])[0] or 0 if p.exists() else 0)" hs300.db 2>/dev/null || echo 0)
          echo "历史深度: ${HISTORY_BARS} 根 K 线（选股需要 >= 221）"
          DAYS=90
          COLD=0
          if [ "$HISTORY_BARS" -lt 221 ]; then
            echo "::warning::历史深度不足（${HISTORY_BARS} < 221）—— 90 天补抓不会让历史变长，改用 450 天冷启动重建"
            DAYS=450
            COLD=1
          fi
          # ⚠️「某几天整天是 0 只」= 谱系断在半路，不是「漏了几天」（2026-11-04 加）。
          # gap-fill 只补「库里已有日期之外」的缺口，谱系整段断裂时容易原地打转，
          # 所以这种情况改用 400 天重建。
          ZERO_DAYS=$(grep -c ': 0 只' /tmp/gaps_before.txt 2>/dev/null || true)
          ZERO_DAYS=${ZERO_DAYS:-0}
          echo "体检（补抓前）报告里「整天 0 只」的天数: ${ZERO_DAYS}"
          if [ "$ZERO_DAYS" -gt 0 ]; then
            echo "::warning::有 ${ZERO_DAYS} 天整天没有行情 —— 判定谱系断裂，改 450 天重建"
            COLD=1
            DAYS=450
          fi
          # ⚠️ 这里**故意不删库**（2026-11-04 决定，改这块前先读完）。
          #
          # 曾经的思路是照搬 daily-audit 的「弃库冷启动」。实测后否掉，两个理由：
          # 1. **不需要**：本地用同样的烂库（54 根 K 线、最新日停在 10-23、
          #    10-14~10-23 只数递减 143→65）跑同一条 --gap-fill 命令，
          #    10-26~11-04 全部补齐（262 个交易日）。gap-fill 本来就会补
          #    「库里没有的日期」，谱系断在半路也是缺口，不必删库。
          # 2. **有害**：_resolve_constituents 在**空库**时直接 raise FetchError
          #    —— 成分股接口只有东财一个源、没有备源（见 sync_service 同名函数
          #    docstring 与 .learnings/ERRORS.md）。CI 里东财若不可达，
          #    「删库再同步」= 一行都抓不到，还顺手把唯一可用的 285 根历史删掉；
          #    报错又被下面的兜底吞掉，表现成「补抓 2 秒就结束」。
          # 所以这里只放宽窗口 + 把 rc 打出来，把「要不要重建」留给人判断。
          #
          # 补充（2026-11-04 当天又修了一层）：即使库是空的、东财成分股接口也不可达，
          # _resolve_constituents 现在会用仓库内置的 data/hs300_constituents.json
          # 兜底，冷启动不会再卡在第一步（原来会 raise FetchError，表现为
          # 「补抓 2 秒结束、补抓后历史深度 0 根」）。
          if [ "$COLD" = "1" ]; then
            echo "::notice::判定谱系需重建，已把窗口放宽到 450 天（不删库：删库会让空库 FetchError 且丢掉可用历史）"
          fi
          START="$(TZ=Asia/Shanghai date -d "${END} -${DAYS} days" +%F)"
          echo "补抓区间: ${START} ~ ${END}（DAYS=${DAYS} COLD=${COLD}）"
          # 把 sync 输出留下来 + **记录它自己的退出码**（2026-11-04 加）。
          # 原来只有 `| tail -20 || true`：同步如果报错（例如空库 FetchError），
          # 日志里既看不到错误也看不到 rc，只剩步骤「成功」和一堆 0 只的日期。
          SYNC_OUT="$(mktemp)"
          set +e
          python3 stock_cli.py sync-hs300-range \
            --start "$START" --end "$END" --db hs300.db \
            --gap-fill --concurrency 6 --rate 6 --retries 3 --backoff 0.8 2>&1 | tee "$SYNC_OUT" | tail -20
          SYNC_RC=${PIPESTATUS[0]}
          set -e
          echo "补抓退出码: ${SYNC_RC}（非 0 = 同步本身报错，不是「数据源没数据」）"
          # 非 0 时把错误打成 GitHub annotation（2026-11-04 加，2026-11-05 改进）。
          #
          # ⚠️ 2026-11-05 教训：原来只取 `grep -m1 Traceback` 那一行 ——
          # 而 traceback 的**第一行永远是**「Traceback (most recent call last):」，
          # annotation 就只有这一句废话，真正的异常（最后一行）完全看不到。
          # 实测在 run 首页只看到「补抓同步失败 rc=1：Traceback (most recent call last):」，
          # 于是一整轮排查都卡在「到底是哪个异常」。
          # 现在取**最后几行**（异常类型+消息在末尾），并且逐行打 annotation。
          if [ "${SYNC_RC}" != "0" ]; then
            echo "---- sync 输出（最后 60 行）----"
            tail -60 "$SYNC_OUT" || true
            echo "--------------------------------"
            # 取最后 6 行非空输出：traceback 的异常类型与消息就在末尾。
            ERRS=$(grep -v '^[[:space:]]*$' "$SYNC_OUT" | tail -6 || true)
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::补抓 rc=${SYNC_RC}：${line}"
            done <<< "$ERRS"
          fi
          {
            echo "### 补抓摘要（DAYS=${DAYS} COLD=${COLD} rc=${SYNC_RC}）"
            echo '**区间与统计**'
            echo '```'
            grep -E '区间同步|写入行|成分股' "$SYNC_OUT" || echo '(没有区间同步输出 —— 说明同步在更早的地方就退出了)'
            echo '```'
            echo '**最后 30 行（异常就在这里）**'
            echo '```'
            tail -30 "$SYNC_OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 补抓后立刻打印最近 10 个交易日的覆盖情况，让「跑完了但那天还是 0 只」当场可见。
          python3 -c "import sqlite3;c=sqlite3.connect('hs300.db');rows=c.execute('SELECT trade_date,COUNT(DISTINCT code) FROM daily_prices GROUP BY trade_date ORDER BY trade_date DESC LIMIT 10').fetchall();print('最近10个交易日覆盖:');[print('  %s %d' % (d,n)) for d,n in rows]" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: 体检（补抓后，仍有缺口则失败）
        id: check_after
        run: |
          # `rc=$?` 取的是**管道最后一环**（tee）的退出码，不是 check_gaps 的 ——
          # 所以必须先开 pipefail，否则 rc 恒为 0：既让「仍有缺口则失败」这道红灯
          # 永远不亮，也让下游缓存 key 的 clean 恒为 true（等于没有谱系守卫）。
          # 注意 GitHub 默认 shell 是 `bash -e {0}`，**不带 -o pipefail**
          # （只有显式 shell: bash 才带），所以要自己开。
          # 开了 pipefail 后管道的 `$?` 就是第一个非零退出码（即 check_gaps 的），
          # 比读 PIPESTATUS 更稳（`||` 后面再读 PIPESTATUS 容易拿到赋值命令自己的状态）。
          set -o pipefail
          rc=0
          python3 scripts/check_gaps.py --db hs300.db --days 30 --min-codes 280 \
            | tee /tmp/gaps_after.txt || rc=$?
          # ⚠️ check_gaps 默认**不含当前日历日**（当天行情收盘后才落地，
          # 收盘前跑必报「当天 0 只」的假缺口 ⇒ 这道红灯会永远亮、
          # clean 恒为 false ⇒ 谱系永远存不进去 —— 实测 2026-11-05）。
          { echo "## 体检（补抓后）"; echo '```'; cat /tmp/gaps_after.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # ⚠️ 谱系根的资格还要看**历史深度**（2026-11-01 修）。
          # 为什么：restore-keys 取**最新**的匹配条目，谁最后保存谁就是下一个 run
          # 的起点。gap-heal 若把一条「30 天无缺口但历史只有 54 天」的库存成谱系根，
          # 它就是最新条目 → 其它 workflow 下次 restore 命中它 → 短历史问题
          # **原封不动地传下去**，冷启动刚做完的成果被覆盖。
          # 历史不够 ⇒ 存 degraded- 前缀（隔离，不参与 restore-keys 命中）。
          HISTORY_BARS=$(python3 -c "import sqlite3,pathlib,sys; p=pathlib.Path(sys.argv[1]); print((sqlite3.connect(p).execute('SELECT MAX(n) FROM (SELECT COUNT(*) n FROM daily_prices GROUP BY code)').fetchone() or [0])[0] or 0 if p.exists() else 0)" hs300.db 2>/dev/null || echo 0)
          echo "补抓后历史深度: ${HISTORY_BARS} 根 K 线（需 >= 221）"
          if [ "$rc" -ne 0 ]; then
            echo "::error::补抓后仍有缺口（rc=$rc，详见上文明细）；可能是数据源当日无数据或停牌集中"
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$HISTORY_BARS" -lt 221 ]; then
            echo "::error::历史深度仍不足（${HISTORY_BARS} < 221）—— 这条谱系算不出选股，"
            echo "::error::不能当谱系根（否则短历史会一直传递下去）。请让 deploy-site 走冷启动重建。"
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"

      - name: 备份 hs300.db（artifact，90 天）
        if: always()
        run: |
          if [ ! -f hs300.db ]; then
            echo "::warning::没有 hs300.db 可备份"
            exit 0
          fi
          STAMP="$(TZ=Asia/Shanghai date +%Y%m%d)"
          gzip -c hs300.db > "/tmp/hs300-${STAMP}.db.gz"
          ls -lh "/tmp/hs300-${STAMP}.db.gz"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: 上传备份
        if: always() && env.STAMP != ''
        uses: actions/upload-artifact@v4
        with:
          name: hs300-db-${{ env.STAMP }}
          path: /tmp/hs300-*.db.gz
          retention-days: 90

      # 存**谱系之前**先把库瘦身（2026-11-04 加）。
      # 理由见 deploy-site.yml 的同名步骤：trade_plan（含索引）占全库 94%，而它是
      # 派生表（daily_picks + daily_prices 可重算）⇒ 只删它、不碰行情。
      - name: 瘦身库（trade_plan 是派生表，可重算）
        id: slim
        if: always()
        run: |
          set -uo pipefail
          # ⚠️ **必须原地瘦身**（不加 --out），文件名保持 hs300.db（下游都按它找库）。
          if python3 scripts/slim_db_for_cache.py --db hs300.db; then
            echo "slim_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "slim_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::瘦身失败 —— 仍存原库（上传更大但不会丢数据）"
          fi

      - name: 保存谱系到 release（只让「补抓后无缺口」的库当谱系根）
        id: save_lineage
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 谱系根的资格：补抓后体检必须干净（check_after 会输出 clean）。
          # 无条件覆盖会让一次补抓失败的库也成为谱系根 → 缺口被固化并逐日传递
          # （2026-10-29 查明 CI 行情谱系断在 2026-10-13）。
          python3 scripts/db_lineage.py save --db hs300.db \
            --lineage-ok "${{ steps.check_after.outputs.clean }}"
