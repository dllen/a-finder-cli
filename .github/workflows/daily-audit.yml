name: daily-audit

# 每晚 21:00（北京）巡检数据产出：三层体检 → 自动补齐 → 复检 → 发布 → 报告。
#
# 与 deploy-site.yml 是各自独立的 workflow，**失败互不影响**（巡检失败不影响早班发布，
# 反之亦然）；但两者**共用 hs300.db 缓存**（`hs300-db-*` 前缀、restore-keys 互相兜底），
# 所以「解耦」指失败隔离，不是数据隔离。
# 为什么要有这条链路：GitHub schedule 对该仓库不可靠（10-26 的 07:30 那班
# 延迟到 14:27 UTC，10-27 三班一次都没触发），且缺口一旦静默发生没人知道。
on:
  schedule:
    # 13:00 UTC = 21:00 北京，给早班 8 次机会（07:30–09:00 UTC）留足余量
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-audit
  cancel-in-progress: false

permissions:
  contents: write        # 需要推 gh-pages

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 判定今天日期与是否交易日
        id: trade-day
        run: |
          set -uo pipefail
          # 交易日口径只有一个来源：market_calendar.trading_days（与体检同一份）。
          # 手写一份 is_workday(d) and d.weekday() < 5 就是又一份口径，
          # 设计文档里「口径漂移的代价已经付过一次」说的就是这种事。
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import datetime as dt
          from market_calendar import trading_days
          d = dt.date.today()
          window = trading_days(d - dt.timedelta(days=60), d)
          ok = bool(window)
          # 日历不可用时不能谎报「非交易日」—— 那会把「不知道」说成「不是交易日」。
          # 用 unknown 表达，日历不可用的事实由体检步的 rc=2 暴露。
          is_trade = (d.isoformat() in window) if ok else None
          print(f"today_bj={d.isoformat()}")
          print(f"is_trade_day={'unknown' if is_trade is None else str(is_trade).lower()}")
          print(f"calendar_ok={str(ok).lower()}")
          PY
          # 日历不可用时 trading_days 返回 []：体检那一步会以 rc=2（无法判定）
          # 失败，这里只留一条明确的红注释说明根因。
          if grep -qx 'calendar_ok=false' "$GITHUB_OUTPUT"; then
            echo "::error::交易日历不可用（chinese_calendar 缺失或无当年数据），无法判定今天是否交易日"
          fi
          # cron 排的是「周一到周五」，但长假（如国庆）会落在这上面。那天跑巡检只是
          # 「巡检历史」，没有当日新增产出 —— 明确写进 Step Summary，别让绿色心跳
          # 被读成「今天的数据已更新」。
          if grep -qx 'is_trade_day=false' "$GITHUB_OUTPUT"; then
            {
              echo "### 非交易日，仅巡检历史"
              echo ""
              echo "今天（$(grep -m1 '^today_bj=' "$GITHUB_OUTPUT" | cut -d= -f2)）不是 A 股交易日：本次按近 30 天窗口检查历史数据，不期待当日新增行情/选股/计划。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore hs300.db from cache
        uses: actions/cache@v4
        with:
          path: hs300.db
          key: hs300-db-${{ github.run_id }}
          restore-keys: |
            hs300-db-

      # 陈旧谱系检测：缓存库落后太多时，删掉它走冷启动重建。
      #
      # 为什么必须有这一步（2026-10-30 实测的根因）：
      #   巡检的 L1 自动修复窗口（零行缺口 60 个交易日 / 部分缺口 7 个交易日）
      #   只能补「缺口」，补不了「整条谱系断在半路」的状态 —— 而缓存谱系一旦
      #   断了两周以上，缺口就分散在两周的日期里，补抓要付出成倍的数据源配额，
      #   还可能在中途被限流打断，失败后缺口又变成「超窗只报警」⇒ 永远红。
      #
      #   db_freshness 的 rc=3（落后 > MAX_LAG 个交易日）就是「这条谱系很久
      #   没推进了」的判据。命中它就删库冷启动，比在烂谱系上打补丁可靠。
      #   （deploy-site.yml 已有同样的判据；这里必须也有 —— 巡检是晚班，
      #   白班的冷启动没跑成时，晚班要能自己收拾。）
      - name: 检测陈旧谱系（落后过多则弃库冷启动）
        id: lineage
        env:
          EXPECT: ${{ steps.trade-day.outputs.today_bj }}
          MAX_LAG: "3"
        run: |
          set -uo pipefail
          if [ ! -f hs300.db ]; then
            echo "orphan=true" >> "$GITHUB_OUTPUT"
            echo "cold_start=true" >> "$GITHUB_OUTPUT"
            echo "::notice::无缓存 DB → 冷启动"
            exit 0
          fi
          set +e
          python3 scripts/db_freshness.py --db hs300.db \
            --expect "$EXPECT" --max-lag "$MAX_LAG" --github-output
          rc=$?
          set -e
          echo "freshness_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 3 ]; then
            echo "cold_start=true" >> "$GITHUB_OUTPUT"
            echo "::error::缓存库谱系落后过多（孤儿）—— 丢弃该库，改走冷启动重建"
            rm -f hs300.db
          elif [ "$rc" -eq 2 ]; then
            # 读不了库 / 空库：同样是「没有可用谱系」，按冷启动处理。
            # 不能当成「库里很新」——那会让后续步骤把一个坏库当好库发布。
            echo "cold_start=true" >> "$GITHUB_OUTPUT"
            echo "::warning::缓存库不可读或为空 → 按冷启动处理"
            rm -f hs300.db
          else
            echo "cold_start=false" >> "$GITHUB_OUTPUT"
          fi

      # 冷启动同步：把 400 天的行情一次性拉回来（陈旧谱系重建）。
      #
      # 为什么必须放在体检**之前**：体检的基准是「应有交易日」，谱系缺了 400 天
      # 就会报出 400 天的 L1 缺口 —— 逐日补抓要几百次请求，必然被限流打断。
      # 一次大窗口同步快得多，也更容易一次成功。
      - name: 冷启动同步（陈旧谱系重建，400 天）
        if: steps.lineage.outputs.cold_start == 'true'
        env:
          EXPECT: ${{ steps.trade-day.outputs.today_bj }}
        run: |
          set -uo pipefail
          echo "::notice::冷启动：窗口扩到 400 天，并发/限流上调"
          ok=0
          for attempt in 1 2 3; do
            echo "── 第 $attempt 次冷启动同步 ──"
            SYNC_END_DATE="$EXPECT" \
              bash a-finder.sh sync-incremental hs300.db 20 pick-history 2>&1 | tail -40 || true
            # 数据源 15:30 后才出数/被限流时会失败，等 120s 再试（最多 3 轮）。
            if python3 scripts/ci_check_data.py --db hs300.db --expect "$EXPECT" \
              --prices-only --source direct; then
              ok=1; break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "行情未就绪，120s 后重试…"
              sleep 120
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::冷启动同步 3 轮后仍未拿到期望交易日的完整行情"
            echo "cold_sync_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: 三层体检
        id: audit
        env:
          TODAY: ${{ steps.trade-day.outputs.today_bj }}
        run: |
          set -uo pipefail
          if [ ! -f hs300.db ]; then
            echo "::error::缓存里没有 hs300.db：早班从未成功跑过或缓存已过期"
            echo "no_db=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 显式传 --today：手工 workflow_dispatch 跨零点时，「今天」还没开盘，
          # 不传就会把当天算进应有交易日 → 报出「今天 行情只有 0 只」这种假缺口。
          ARGS=()
          [ -n "${TODAY:-}" ] && ARGS+=(--today "$TODAY")
          set +e
          python3 scripts/audit_coverage.py --db hs300.db --out /tmp/audit.json \
            ${ARGS[@]+"${ARGS[@]}"}
          rc=$?
          set -e
          echo "audit_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 2 ]; then
            echo "::error::体检无法判定（日历不可用或库读取失败）—— 绝不当作无缺口"
            exit 1
          fi
          # 报告必须落盘：体检崩了却没写出报告时，下游会一路静默降级
          # （修复步拿不到报告 → 复检干净 → 通知把「读不到」当成「没有缺口」），
          # 最后发出一条绿色「✅ 巡检通过」。这里当致命错误处理（2026-10-28 评审复现）。
          if [ ! -s /tmp/audit.json ]; then
            echo "::error::体检报告没有落盘（/tmp/audit.json 不存在或为空）—— 绝不当作无缺口"
            exit 1
          fi
          echo "（$rc = 1 表示有缺口，符合预期时会继续修复）"

      - name: 自动修复
        id: repair
        if: steps.audit.outputs.audit_rc == '1'
        env:
          TODAY: ${{ steps.trade-day.outputs.today_bj }}
          # 两个窗口都显式传出来，别依赖脚本默认值：
          #   MAX_PRICE_DAYS  部分行情缺口（有行但不全）→ 窄窗（混复权口径风险）
          #   MISSING_DAYS_CAP 零行行情缺口（整天没抓）  → 宽窗（没有序列可污染）
          # 2026-10-30 的事故就是「统一 7 天窗」把 13 天的零行缺口永久挡在窗外，
          # 每晚重复报警、永远修不上。以后调窗口必须改这里 + 改脚本默认值。
          MAX_PRICE_DAYS: "7"
          MISSING_DAYS_CAP: "60"
        run: |
          set -uo pipefail
          ARGS=()
          [ -n "${TODAY:-}" ] && ARGS+=(--today "$TODAY")
          ARGS+=(--max-price-days "${MAX_PRICE_DAYS}")
          ARGS+=(--missing-days-cap "${MISSING_DAYS_CAP}")
          set +e
          python3 scripts/repair_gaps.py --db hs300.db \
            --report /tmp/audit.json --out /tmp/repair.json \
            ${ARGS[@]+"${ARGS[@]}"}
          rc=$?
          set -e
          echo "repair_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "（1 = 部分修复失败，仍需复检并报警）"

      - name: 复检
        id: recheck
        if: steps.audit.outputs.audit_rc == '1'
        env:
          TODAY: ${{ steps.trade-day.outputs.today_bj }}
        run: |
          set -uo pipefail
          ARGS=()
          [ -n "${TODAY:-}" ] && ARGS+=(--today "$TODAY")
          set +e
          python3 scripts/audit_coverage.py --db hs300.db --out /tmp/audit2.json \
            ${ARGS[@]+"${ARGS[@]}"}
          rc=$?
          set -e
          # 复检报告同样必须落盘：没有它就无从判断「还缺不缺」，更不能导出部署。
          if [ "$rc" -eq 2 ] || [ ! -s /tmp/audit2.json ]; then
            echo "::error::复检无法判定或报告没有落盘（/tmp/audit2.json）—— 绝不当作无缺口"
            echo "recheck_rc=2" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "recheck_rc=$rc" >> "$GITHUB_OUTPUT"

      - name: 导出修复后的数据（仅在复检干净时）
        id: export
        if: steps.recheck.outputs.recheck_rc == '0'
        env:
          EXPECT: ${{ steps.trade-day.outputs.today_bj }}
        run: |
          set -uo pipefail
          python3 export_json.py --db hs300.db --out site
          # 单调性守卫：产物最新日不得比**线上**更旧。
          # 为什么必须比线上：2026-10-29 查明 CI 缓存库与本地库是两条独立谱系
          # （CI 行情谱系断在 2026-10-13，站点却由本地库发布到 10-29）。孤儿库
          # 导出的 dates.json=["2026-10-13"] 能通过 --min-dates 1 的门禁 → 巡检
          # 会把比线上旧 16 天的站点 force-push 上去：页面看着正常、数据停在
          # 半个月前，比 2026-10-27 的空站点更隐蔽。拿线上最新日当下限。
          LIVE_LATEST=$(curl -sf --max-time 20 https://ycu.space/data/dates.json \
            | python3 -c "import json,sys;d=json.load(sys.stdin).get('dates') or [''];print(d[0])" 2>/dev/null || echo "")
          if [ -n "$LIVE_LATEST" ]; then
            echo "线上最新日: $LIVE_LATEST（产物的下限）"
            python3 scripts/verify_site_export.py --site site --not-older-than "$LIVE_LATEST"
          else
            # 查不到线上日期时不敢用「无下限」放行：那正是空站点事故的同款漏洞。
            echo "::warning::查不到线上最新日，改用期望交易日 $EXPECT 作为下限"
            python3 scripts/verify_site_export.py --site site --expect-latest "$EXPECT"
          fi

      - name: 部署 gh-pages（仅在导出校验通过时）
        if: steps.export.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "audit: 补齐缺口并更新 ${{ steps.trade-day.outputs.today_bj }}"

      - name: 保存修复后的 hs300.db 到缓存（只让「确认干净」的库当谱系根）
        id: save_cache
        if: always()
        uses: actions/cache@v4
        with:
          path: hs300.db
          # 谱系根的资格：**体检确认无缺口**，或者**修复后复检干净**。
          # 为什么：actions/cache 的 restore-keys 取**最新**的匹配条目，谁最后保存谁
          # 就是下一个 run 的起点。无条件保存会让失败/半修复的库也成为谱系根 →
          # 缺口被固化并逐日传递（2026-10-29 查明 CI 行情谱系断在 2026-10-13）。
          #
          # 为什么条件里必须带 `audit_rc == '0'`：复检步骤的 if 是
          # `audit_rc == '1'`（有缺口才复检）。所以**体检无缺口时复检根本没跑**，
          # `recheck_rc` 是空字符串 → `'' == '0'` 为假 → 只看 recheck_rc 会把一个
          # 干干净净的库判成 degraded 隔离掉。这正是「体检通过反而让谱系不推进」的
          # 反向 bug（本文件改这行之前的版本踩过）。
          #
          # 隔离用的 degraded- 前缀**必须不以 hs300-db- 开头**，否则 restore-keys
          # 仍然命中它，等于没隔离（留作事后排查用）。
          key: ${{ (steps.audit.outputs.audit_rc == '0' || steps.recheck.outputs.recheck_rc == '0') && format('hs300-db-{0}', github.run_id) || format('degraded-hs300-db-{0}', github.run_id) }}

      - name: 通知
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -uo pipefail
          # 日历步失败时 today_bj 为空：裸 --today 会让 argparse 先死，告警渠道整个失效。
          # 空则让脚本回退报告里的 today（--no-db 时回退系统日期）。
          TODAY="${{ steps.trade-day.outputs.today_bj }}"
          ARGS=""
          [ -n "$TODAY" ] && ARGS="--today $TODAY"
          # 有复检报告时：--audit 用复检（决定「剩余」），--audit-pre 用原报告（算「已修复」）
          if [ -f /tmp/audit2.json ]; then
            ARGS="$ARGS --audit /tmp/audit2.json --audit-pre /tmp/audit.json"
          elif [ -f /tmp/audit.json ]; then
            ARGS="$ARGS --audit /tmp/audit.json"
          fi
          [ -f /tmp/repair.json ] && ARGS="$ARGS --repair /tmp/repair.json"
          if [ "${{ steps.audit.outputs.no_db }}" = "true" ]; then
            ARGS="$ARGS --no-db"
          fi
          # 非交易日的标注必须进推送正文（不只写 Step Summary）：
          # 手机上收到的推送才是用户真会读的那一条。
          if [ "${{ steps.trade-day.outputs.is_trade_day }}" = "false" ]; then
            ARGS="$ARGS --non-trading-day"
          fi
          python3 scripts/notify_audit.py $ARGS

      - name: 有未修复缺口或修复失败则让 run 变红
        # 通知本身总是 rc=0（告警渠道失败不该掩盖结论），这里把「需人工」显式暴露成红灯。
        # 修复失败（repair_rc=1）同样要红：不能只发一条通知就让 run 变绿。
        if: always() && ((steps.audit.outputs.audit_rc == '1' && steps.recheck.outputs.recheck_rc != '0') || steps.repair.outputs.repair_rc == '1')
        run: |
          echo "::error::巡检发现无法自动修复的缺口或修复失败，详见 Step Summary 与通知"
          exit 1
