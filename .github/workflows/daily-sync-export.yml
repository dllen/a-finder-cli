name: daily-sync-export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-sync-export.yml'
  schedule:
    # 工作日 15:30（北京时间）≈ 07:30 UTC，收盘后跑
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-sync-export
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 单 job：同步数据 → 构建 site/ → 直接发布到 gh-pages。
  # site/ 是 gitignore 的构建产物，不能跨 job 通过 git checkout 传递，
  # 因此在同一 runner 内构建并发布，无需提交回 main。
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore hs300.db from cache
        uses: actions/cache@v4
        with:
          path: hs300.db
          key: hs300-db-${{ github.run_id }}
          restore-keys: |
            hs300-db-

      - name: Run daily pipeline (sync + picks + plan)
        run: |
          bash sync_incremental_pick.sh hs300.db 20 pick-history
          python stock_cli.py plan --db hs300.db --date "$(date +%F)"

      - name: Build all tier portfolios
        run: |
          python stock_cli.py plan build-all --db hs300.db \
            --strategy linyuan --tiers 50000,100000,150000,200000,250000,300000,350000,400000,450000,500000

      - name: Export static site
        run: |
          python export_json.py --db hs300.db --out site
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Save hs300.db to cache
        uses: actions/cache@v4
        with:
          path: hs300.db
          key: hs300-db-${{ github.run_id }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
