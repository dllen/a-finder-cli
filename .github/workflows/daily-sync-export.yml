name: daily-sync-export

on:
  schedule:
    # 工作日 15:30（北京时间）≈ 07:30 UTC，收盘后跑
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore hs300.db from cache
        uses: actions/cache@v4
        with:
          path: hs300.db
          key: hs300-db-${{ github.run_id }}
          restore-keys: |
            hs300-db-

      - name: Run daily pipeline (sync + picks + plan)
        run: |
          bash sync_incremental_pick.sh hs300.db 20 picks || true
          python stock_cli.py plan --db hs300.db --date "$(date +%F)" || true

      - name: Export static site
        run: |
          python export_json.py --db hs300.db --out site
          cp site/index.html site/404.html

      - name: Save hs300.db to cache
        uses: actions/cache@v4
        with:
          path: hs300.db
          key: hs300-db-${{ github.run_id }}

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: regenerate static site ($(date +%F))"
            git push
          fi
