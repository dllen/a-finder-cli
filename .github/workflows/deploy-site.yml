name: deploy-site

# A 股交易日收盘后自动刷新数据并部署 gh-pages。
# 取代原 fetch-data.yml 的「只同步不部署」——现在 CI 完全接管部署。
# 交易日判定用 chinese_calendar（周末/法定节假日/调休补班精确识别）。
on:
  schedule:
    # A股收盘 15:00 北京，数据落地约 15:30 → 07:30 UTC
    #
    # 为什么这么密：GitHub 的 schedule 队列对这个仓库不可靠 —— 实测 10-26 的 07:30
    # 那一班直到 14:27 UTC 才跑（延迟 7 小时），10-27 的三班干脆一次都没触发。
    # 密集排班是为了让「队列延迟」只需要影响其中一班；已发布当天的班会被下面的
    # freshness 步骤短路（秒退），不会浪费 CI 分钟。
    #
    # 另有两条独立于 GitHub 调度的腿：Cloudflare Workers Cron（07:35 / 08:35 UTC）
    # 发 workflow_dispatch，以及本机 launchd 兜底（a-finder.sh fallback）。
    - cron: "30 7 * * *"
    - cron: "45 7 * * *"
    - cron: "0 8 * * *"
    - cron: "15 8 * * *"
    - cron: "30 8 * * *"
    - cron: "45 8 * * *"
    - cron: "0 9 * * *"
    - cron: "30 9 * * *"
    # 补救跑：北京 16:30（08:30 UTC）。15:30 那班若因数据源延迟/限流没拿到当天行情，
    # 一小时后再试一次；若线上已发布当天数据则整轮跳过（见 freshness 步骤）。
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: write   # push gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 判定 A 股交易日
        id: trade-day
        env:
          TZ: Asia/Shanghai          # 让 Python 的 date.today() 取北京日期
        run: |
          python -m pip install chinese_calendar
          # 北京日期：runner 是 UTC，07:30 UTC 与北京同一天，但手动 dispatch
          # 可能落在北京 00:00~08:00（UTC 前一天），必须显式用 +08 的日期。
          echo "today_bj=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import datetime, os
          from chinese_calendar import is_workday
          today = datetime.date.today()
          if is_workday(today):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("is_trade_day=true\n")
              print(f"{today} 是 A 股交易日")
          else:
              print(f"{today} 非交易日（周末或节假日），跳过")
          PY

      - name: 检查是否需要跑（补救 cron 遇到「已发布」则跳过）
        id: freshness
        if: steps.trade-day.outputs.is_trade_day == 'true'
        env:
          EXPECT: ${{ steps.trade-day.outputs.today_bj }}
        run: |
          # 密集排班下每一班都先看线上是否已发布当天：
          # 已发布 → 秒退（避免重复消耗 CI 分钟与数据源配额）
          # 未发布 → 继续跑（这正是我们想要的补救）
          published=$(curl -sf --max-time 20 https://ycu.space/data/dates.json \
            | python3 -c "import json,sys;d=json.load(sys.stdin).get('dates') or [''];print(d[0])" 2>/dev/null || echo "")
          if [ "$published" = "$EXPECT" ]; then
            echo "::notice::线上已发布 $EXPECT，本班跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "线上最新 ${published:-无} ≠ 期望 $EXPECT，继续"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore hs300.db from cache
        if: steps.trade-day.outputs.is_trade_day == 'true' && steps.freshness.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: hs300.db
          # key 必须每次唯一：固定 key 会导致首次保存后缓存永远不再更新
          # （actions/cache 不允许覆盖已存在的 key），每天从同一份旧 DB 增量同步。
          key: hs300-db-${{ github.run_id }}
          restore-keys: |
            hs300-db-

      # 行情来源：优先从 Cloudflare D1（Worker 每天抓好的数据）拉增量；
      # Worker 不可用/无新数据时（退出码 3 → fell_back=true）回退原来的直连数据源。
      - name: 增量同步行情（直连数据源，短窗口 + 重试到落地）
        id: sync
        if: steps.trade-day.outputs.is_trade_day == 'true' && steps.freshness.outputs.skip != 'true'
        env:
          EXPECT: ${{ steps.trade-day.outputs.today_bj }}
          # 日常只补最近 60 天：请求少 → 限流概率低 → 当天更可能同步成功
          SYNC_DAYS: "60"
          SYNC_RETRIES: "2"
          SYNC_CONCURRENCY: "6"
          SYNC_RATE: "6"
        run: |
          set -uo pipefail
          COLD=0
          [ -f hs300.db ] || COLD=1
          if [ "$COLD" = "1" ]; then
            echo "::notice::无缓存 DB，冷启动：扩大窗口到 400 天"
            export SYNC_DAYS=400 SYNC_CONCURRENCY=8 SYNC_RATE=8 SYNC_RETRIES=3
          fi
          ok=0
          for attempt in 1 2 3; do
            echo "── 第 $attempt 次同步 ──"
            SYNC_END_DATE="$EXPECT" \
              bash a-finder.sh sync-incremental hs300.db 20 pick-history 2>&1 | tail -40 || true
            if python3 scripts/ci_check_data.py --db hs300.db --expect "$EXPECT" --prices-only --source direct; then
              ok=1; break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "行情未就绪（数据源可能延迟），120s 后重试…"
              sleep 120
            fi
          done
          if [ "$ok" = "1" ]; then
            echo "prices_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "prices_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::三次同步后期望交易日 $EXPECT 的行情仍不完整"
          fi


      - name: 选股 + 计划 + 组合 + 可转债
        if: steps.trade-day.outputs.is_trade_day == 'true' && steps.freshness.outputs.skip != 'true'
        env:
          BACKFILL_ANCHOR: "2026-08-01"
        run: |
          set -e
          # 计划日期对齐「库里真正的行情最新日」，而不是硬编码今天：
          # 同步失败时不会为一个没有行情的日期生成空计划，也不会让后续步骤中断。
          DATA_DATE=$(python3 -c "import sqlite3;print(sqlite3.connect('hs300.db').execute('SELECT MAX(trade_date) FROM daily_prices').fetchone()[0])")
          echo "行情最新日: $DATA_DATE（期望交易日 ${{ steps.trade-day.outputs.today_bj }}）"
          echo "## 数据日期 $DATA_DATE" >> "$GITHUB_STEP_SUMMARY"
          python stock_cli.py plan build --db hs300.db --date "$DATA_DATE"
          python stock_cli.py plan build-all --db hs300.db --date "$DATA_DATE" \
            --strategy linyuan --tiers 50000,100000,150000,200000,250000,300000,350000,400000,450000,500000
          python stock_cli.py plan build-all --backfill --since "$BACKFILL_ANCHOR" --db hs300.db
          # 可转债：全市场扫描慢 + 易限流，失败不中断
          python stock_cli.py cb-picks --top 20 --db hs300.db --concurrency 2 --rate 4 || true

      - name: 导出静态站 + 校验产物
        id: export
        if: always() && steps.trade-day.outputs.is_trade_day == 'true' && steps.freshness.outputs.skip != 'true'
        env:
          EXPECT: ${{ steps.trade-day.outputs.today_bj }}
        run: |
          set -uo pipefail
          # open_db 在库不存在时会新建空库 → 导出"成功"但站点无数据。
          # 2026-10-27 线上就是被这样的空产物 force-push 清空的，必须校验内容。
          python3 export_json.py --db hs300.db --out site
          # 单调性守卫：产物最新日不得比**线上**更旧。
          # 为什么必须比线上：2026-10-29 查明 CI 缓存库与本地库是两条独立谱系
          # （CI 行情谱系断在 2026-10-13，站点却由本地库发布到 10-29）。孤儿库
          # 导出的 dates.json=["2026-10-13"] 能通过 --min-dates 1 的门禁 → CI
          # 会把比线上旧 16 天的站点 force-push 上去：页面看着正常、数据停在
          # 半个月前，比 2026-10-27 的空站点更隐蔽。拿线上最新日当下限。
          LIVE_LATEST=$(curl -sf --max-time 20 https://ycu.space/data/dates.json \
            | python3 -c "import json,sys;d=json.load(sys.stdin).get('dates') or [''];print(d[0])" 2>/dev/null || echo "")
          if [ -n "$LIVE_LATEST" ]; then
            echo "线上最新日: $LIVE_LATEST（产物的下限）"
            python3 scripts/verify_site_export.py --site site --not-older-than "$LIVE_LATEST"
          else
            # 查不到线上日期时不敢用「无下限」放行：那正是空站点事故的同款漏洞。
            echo "::warning::查不到线上最新日，改用期望交易日 $EXPECT 作为下限"
            python3 scripts/verify_site_export.py --site site --expect-latest "$EXPECT"
          fi

      - name: Save hs300.db to cache（只让「行情已落地」的库当谱系根）
        if: always() && steps.trade-day.outputs.is_trade_day == 'true' && steps.freshness.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: hs300.db
          # 谱系根的资格：本班同步后行情门禁通过（prices_ok=true）。
          # 为什么：actions/cache 的 restore-keys 取**最新**的匹配条目，谁最后保存谁
          # 就是下一个 run 的起点。原来的无条件保存让一个「同步没推进」的库也成为
          # 谱系根 → 缺口被固化并逐日传递（2026-10-29 查明 CI 行情谱系断在
          # 2026-10-13 就是这么来的）。
          # 门禁没过时存到 degraded- 前缀：**必须不以 hs300-db- 开头**，否则
          # restore-keys 仍然命中它，等于没隔离（留作事后排查用）。
          key: ${{ steps.sync.outputs.prices_ok == 'true' && format('hs300-db-{0}', github.run_id) || format('degraded-hs300-db-{0}', github.run_id) }}

      - name: 提示：CI 库未推进时的排查方向
        # 站点由**本地** a-finder.sh site --push 发布（gh-pages 提交信息格式可证），
        # 而本 workflow 的 freshness 步骤读的是**线上** dates.json。于是本地发布
        # 一天 → 线上已有当天 → freshness 判定 skip → 本 workflow 连缓存都不保存
        # → CI 的行情谱系永远停在 2026-10-13（2026-10-29 查明）。
        # 这不是自动能修的：要么让 CI 也发布站点，要么让本地不再发布。
        # 这里只留提示，避免下一个人重新踩同一个坑。
        if: always() && steps.freshness.outputs.skip == 'true'
        run: |
          echo "::notice::本班因线上已发布 ${{ steps.trade-day.outputs.today_bj }} 而跳过同步。" \
               "站点由本地 \`bash a-finder.sh site --push\` 发布，CI 缓存库未随之推进 —— " \
               "这是已知的两谱系问题（见 CLAUDE.md「站点由本地发布」条目），不是本次 run 的失败。"

      - name: 部署 gh-pages
        # 只在导出校验通过时部署：宁可站点停留在上一版，也不要用空产物清空线上
        if: always() && steps.trade-day.outputs.is_trade_day == 'true' && steps.freshness.outputs.skip != 'true' && steps.export.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          commit_message: "site: 自动更新 ${{ steps.trade-day.outputs.today_bj }}"

      # 失败通知：门禁或任何前置步骤失败时推送。
      # 只依赖一个可选的 NTFY_TOPIC secret（ntfy.sh 无需注册，浏览器/App 订阅同名字即可）。
      # 没配也照样写 Step Summary + 让 run 变红，不会静默。
      - name: 失败通知（可选：配置 NTFY_TOPIC 后生效）
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EXPECT: ${{ steps.trade-day.outputs.today_bj }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATA_DATE=$(python3 -c "import sqlite3;r=sqlite3.connect('hs300.db').execute('SELECT MAX(trade_date) FROM daily_prices').fetchone();print(r[0] if r else '?')" 2>/dev/null || echo "?")
          MSG="a-finder 数据流水线失败
          期望交易日: ${EXPECT}
          库里最新: ${DATA_DATE}
          站点可能未更新到最新，点开查看：${RUN_URL}"
          printf '%s\n' "$MSG" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "::notice::未配置 NTFY_TOPIC，跳过推送（失败信息已写入 Step Summary）"
            exit 0
          fi
          curl -sf --max-time 20 \
            -H "Title: a-finder 数据流水线失败" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            --data-binary "$MSG" \
            "https://ntfy.sh/${NTFY_TOPIC}" && echo "已推送通知" \
            || echo "::warning::ntfy 推送失败（不影响 run 结论）"

      # 门禁：站点已经用「当前拿得到的最新数据」更新了（对用户始终可用），
      # 但数据不完整时让 workflow 变红，避免悄无声息地把旧数据当新数据发布。
      - name: 数据完整性门禁
        if: always() && steps.trade-day.outputs.is_trade_day == 'true' && steps.freshness.outputs.skip != 'true'
        env:
          EXPECT: ${{ steps.trade-day.outputs.today_bj }}
        run: |
          set -uo pipefail
          python3 scripts/ci_check_data.py --db hs300.db --expect "$EXPECT" --source direct
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::数据不完整：期望 $EXPECT，详见上方校验输出（站点已按最新可得数据部署）"
            exit 1
          fi
          echo "✅ 数据校验通过：$EXPECT"
