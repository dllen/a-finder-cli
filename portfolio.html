<main class="container py-4">
  <h2 class="mb-3">持仓组合 <small class="text-muted fs-6">[paper]</small></h2>

  <div class="row g-2 align-items-center mb-3">
    <div class="col-auto">
      <div class="date-filter date-filter--compact"
     data-date-filter data-select-id="pf-date">
  <label class="date-filter__label" for="pf-date">计划日期</label>
  <div class="date-filter__control">
    <button type="button" class="date-filter__step" data-step="-1"
            aria-label="前一交易日" aria-controls="pf-date" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M10 12 6 8l4-4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="date-filter__field">
      <select id="pf-date" class="form-select date-filter__select"></select>
    </div>
    <button type="button" class="date-filter__step" data-step="1"
            aria-label="后一交易日" aria-controls="pf-date" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <button type="button" class="date-filter__latest" hidden>回到最新</button>
  <span class="date-filter__status" role="status" aria-live="polite"></span>
</div>
    </div>
    <div class="col-auto d-flex align-items-center gap-2">
      <label class="form-label mb-0" for="pf-strategy">策略</label>
      <select id="pf-strategy" class="form-select form-select-sm w-auto">
        <option value="" selected>全部</option>
        
      </select>
    </div>
    <div class="col-auto ms-auto small text-muted">
      <span class="me-2">基准：所有 tier 共用同一组 daily_picks；按 capital 等权分配 · 数值截至所选日期</span>
    </div>
  </div>

  <h5 class="mt-4">资金档位</h5>
  <div class="d-flex flex-row overflow-auto pb-2 gap-2" id="pf-tier-cards"></div>

  <h5 class="mt-4">累计收益对比</h5>
  <div style="position:relative; height:280px;">
    <canvas id="pf-returns-chart"></canvas>
  </div>

  <div id="pf-detail" class="mt-4"></div>
