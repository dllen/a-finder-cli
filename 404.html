<main class="container py-4">
  <div class="page-header">
    <h1 class="h3 mb-0 page-title">每日机会</h1>
  </div>

  <div id="dashboard"></div>
  
<div class="filter-toolbar">
  <div class="date-filter"
     data-date-filter data-select-id="d">
  <label class="date-filter__label" for="d">日期</label>
  <div class="date-filter__control">
    <button type="button" class="date-filter__step" data-step="-1"
            aria-label="前一交易日" aria-controls="d" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M10 12 6 8l4-4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="date-filter__field">
      <select id="d" class="form-select date-filter__select"></select>
    </div>
    <button type="button" class="date-filter__step" data-step="1"
            aria-label="后一交易日" aria-controls="d" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <button type="button" class="date-filter__latest" hidden>回到最新</button>
  <span class="date-filter__status" role="status" aria-live="polite"></span>
</div>
  <input id="q" type="search" class="form-control" placeholder="筛选：代码 / 名称 / 策略" aria-label="快速筛选">
  
</div>
  <div id="status" class="mb-3"></div>
<div id="prog" class="mb-3"></div>
<div id="log" class="mb-3"></div>
  <div id="board"></div>

  <h2 class="section-title mt-4">策略胜率统计 <small class="text-muted">基于历史标注样本</small></h2>
  <div id="stats"></div>
</main>
