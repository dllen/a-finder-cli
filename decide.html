<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="static/css/app.css?v=fa665a3">
<link rel="stylesheet" href="static/css/date-filter.css?v=fa665a3">
</head>
<body>
<nav class="navbar navbar-expand-md app-nav">
<div class="container">
<a class="navbar-brand" href="/">
<svg class="brand-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<rect x="4" y="9" width="2.4" height="8" rx="0.6" fill="#5b8def"/>
<rect x="8.6" y="5" width="2.4" height="12" rx="0.6" fill="#34c98e"/>
<rect x="13.2" y="11" width="2.4" height="6" rx="0.6" fill="#ef6c6c"/>
<rect x="17.8" y="3" width="2.4" height="14" rx="0.6" fill="#34c98e"/>
<path d="M3 19 L21 8" stroke="#8896a6" stroke-width="1.3" stroke-dasharray="3 2"/>
</svg>
<span>每日机会</span>
</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNav" aria-controls="appNav" aria-expanded="false" aria-label="切换导航">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="appNav">
<div class="navbar-nav ms-auto">
<a class="nav-link " data-nav="picks" href="/">每日机会</a>
<a class="nav-link " data-nav="portfolio" href="/portfolio">持仓组合</a>
<a class="nav-link " data-nav="plan" href="/plan">交易计划</a>
<a class="nav-link " data-nav="cb" href="/cb">可转债</a>
<a class="nav-link active" data-nav="decide" href="/decide">决策台</a>
</div>
</div>
</div>
</nav>

<main class="container py-4">
  <div class="d-flex align-items-center mb-3">
    <h2 class="mb-0">10w 决策台</h2>
    <span class="text-muted fs-6 ms-2">0w 股 + 0w 债 · 最多 8 只 · 单票 ≤10%</span>
    <div class="ms-auto d-flex align-items-center gap-2">
      <div class="date-filter date-filter--compact"
     data-date-filter data-select-id="decide-date">
  <label class="date-filter__label" for="decide-date">日期</label>
  <div class="date-filter__control">
    <button type="button" class="date-filter__step" data-step="-1"
            aria-label="前一交易日" aria-controls="decide-date" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M10 12 6 8l4-4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="date-filter__field">
      <select id="decide-date" class="form-select date-filter__select"></select>
    </div>
    <button type="button" class="date-filter__step" data-step="1"
            aria-label="后一交易日" aria-controls="decide-date" disabled>
      <svg class="date-filter__icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <button type="button" class="date-filter__latest" hidden>回到最新</button>
  <span class="date-filter__status" role="status" aria-live="polite"></span>
</div>
      <button id="decide-refresh" class="btn btn-sm btn-outline-primary write-control">刷新</button>
    </div>
  </div>

  <div id="decide-auth" class="mb-3"></div>
  <div id="decide-status" class="mb-3"></div>

  <div class="row row-cols-2 row-cols-md-3 row-cols-xl-5 g-2 mb-3" id="decide-summary"></div>

  <h5 class="mt-4" id="decide-plan-title">今日执行清单</h5>
  <div id="decide-plan"></div>

  <div id="decide-comparison-wrap">
    <h5 class="mt-4">执行对照</h5>
    <div id="decide-comparison"></div>
  </div>

  <div class="d-flex align-items-center mt-4">
    <h5 class="mb-0">我的实际持仓</h5>
    <button type="button" id="decide-export-csv"
            class="btn btn-sm btn-outline-secondary ms-2"
            title="把股票与转债持仓导出为 CSV（可用 Excel 打开）">导出 CSV</button>
    <span id="decide-export-hint" class="text-muted small ms-2"></span>
  </div>
  <div id="decide-positions"></div>
  <h6 class="mt-3">我的转债持仓</h6>
  <div id="decide-cb-positions"></div>
  <div class="modal fade" id="login-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <form id="login-form" autocomplete="on">
        <div class="modal-header py-2">
          <h6 class="modal-title">登录决策台</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div id="login-error" class="alert alert-danger py-2 mb-2 d-none" role="alert"></div>
          <div class="mb-2">
            <label class="form-label mb-1 small" for="login-user">用户名</label>
            <input id="login-user" class="form-control form-control-sm"
                   autocomplete="username" required>
          </div>
          <div class="mb-2">
            <label class="form-label mb-1 small" for="login-pass">密码</label>
            <input id="login-pass" type="password" class="form-control form-control-sm"
                   autocomplete="current-password" required>
          </div>
        </div>
        <div class="modal-footer py-2">
          <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-sm btn-primary" id="login-submit">登录</button>
        </div>
      </form>
    </div>
  </div>
</div>
</main>

<footer class="app-footer">
<div class="container d-flex flex-column flex-md-row justify-content-between align-items-center py-3 gap-1">

</div>

</html>
