name = "a-finder-api"
main = "worker/index.js"
compatibility_date = "2026-10-25"

# 路由：`ycu.space/api/*` 在 Cloudflare dashboard 里配置（Workers → a-finder-api →
# Settings → Triggers）。不写在这里的原因：配置里的 route 需要 token 具备
# Zone → Workers Routes: Edit 权限，而当前 CLOUDFLARE_API_TOKEN 只有
# Workers Scripts + D1；写进配置会让 deploy 直接失败（实测）。
# 若以后要交给配置管理，先给 token 补 Workers Routes 权限再加回来。

[[d1_databases]]
binding = "DB"
database_name = "a-finder"
database_id = "e9348772-e7ae-43aa-a119-19f707ab1821"

[triggers]
crons = ["35 7 * * *", "35 8 * * *"]
# 07:35 / 08:35 UTC（北京 15:35 / 16:35）：兜底触发 GitHub Actions
# 两次是为了覆盖「15:30 那班被丢、16:30 的 GH 补救 cron 也被丢」的情况

# 观测性：持久化 Worker 日志（cron 抓取排查离不开它）
# dashboard → Workers & Pages → a-finder-api → Logs 可查最近调用；
# 未开启时 console.log 只在实时 tail 可见，事后无据可查。
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
persist = true
