name = "a-finder-api"
main = "worker/index.js"
compatibility_date = "2026-10-25"

[[d1_databases]]
binding = "DB"
database_name = "a-finder"
database_id = "e9348772-e7ae-43aa-a119-19f707ab1821"

routes = [
  { pattern = "ycu.space/api/*", zone_name = "ycu.space" }
]

[triggers]
crons = ["35 7 * * *", "*/2 * * * *"]
# 07:35 UTC：兜底触发 GitHub Actions 来消费 D1
# */2 每 2 分钟：驱动行情抓取状态机（Worker 自己判时段，非交易时段秒退）
