[project]
name = "a-finder-cli"
version = "0.1.0"
description = "A股选股与买卖点提示命令行工具"
requires-python = ">=3.10"
dependencies = [
    "textual",
    "akshare",
    "flask>=3.1.3",
]

[project.scripts]
a-finder = "stock_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "akshare_data_provider",
  "analysis_service",
  "candidate_rules",
  "candidate_schema",
  "cli_layer",
  "config",
  "data_fetch",
  "data_providers",
  "db_repository",
  "db_schema",
  "decision_rules",
  "domain_models",
  "errors",
  "formatter",
  "indicators",
  "logger",
  "market_data",
  "market_regime",
  "risk_manager",
  "scoring",
  "signal_rules",
  "signal_schema",
  "stock_cli",
  "stock_strategies",
  "sync_service",
  "utils",
  "view_models",
]

[tool.setuptools.packages]
find = { include = ["shared_lib*"] }

[tool.setuptools.package-dir]
"" = "."

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
