{% extends "base.html" %}
{% from 'components/date_filter.html' import date_filter %}
{% set active_page = "cb" %}
{% block title %}可转债{% endblock %}

{% block body %}
<main class="container py-4">
  <div class="d-flex align-items-center mb-3">
    <h2 class="mb-0">可转债</h2>
    <span class="text-muted fs-6 ms-2">[独立转债仓]</span>
    <div class="ms-auto d-flex align-items-center gap-2">
      {{ date_filter('cb-date', '日期', compact=true) }}
      <button id="cb-refresh" class="btn btn-sm btn-outline-primary write-control">刷新</button>
    </div>
  </div>

  <div class="row row-cols-1 row-cols-md-3 g-2 mb-3" id="cb-summary"></div>

  <h5 class="mt-4">持仓与预警</h5>
  <div id="cb-alerts"></div>
  <div id="cb-positions" class="mt-3"></div>

  <h5 class="mt-4">转债榜单</h5>
  <div id="cb-board"></div>
</main>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/cb.js') }}"></script>
{% endblock %}
