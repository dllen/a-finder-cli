{# 赞赏（打赏）弹窗：页脚按钮打开，两页共用。
   收款码已裁成「二维码 + 白边」的正方形，不露昵称。
   手机上先选渠道（支付宝 / 微信），只显示一张码，省一次滚动；
   每张码都带「保存图片」下载按钮，长按保存不再是唯一路径。 #}
<div class="modal fade" id="tipModal" tabindex="-1" aria-labelledby="tipModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="tipModalLabel">赞赏支持</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <p class="tip-lede">如果这个站点对你有帮助，可以扫码赞赏一杯咖啡。纯属自愿，不影响任何功能。</p>
        <div class="tip-switch">
          <input class="tip-switch__input" type="radio" name="tip-channel" id="tip-alipay" checked>
          <label class="tip-switch__label" for="tip-alipay">支付宝</label>
          <input class="tip-switch__input" type="radio" name="tip-channel" id="tip-wechat">
          <label class="tip-switch__label" for="tip-wechat">微信支付</label>
          <div class="row g-3 text-center tip-panes">
            <div class="col-12 col-sm-6 tip-pane tip-pane--alipay">
              <a class="tip-qr-link" href="{{ url_for('static', filename='images/alipay-qr.jpeg') }}" target="_blank" rel="noopener" aria-label="打开支付宝收款码原图">
                <img src="{{ url_for('static', filename='images/alipay-qr.jpeg') }}" class="tip-qr" alt="支付宝收款码"
                     width="1156" height="1156" loading="lazy" decoding="async">
              </a>
              <p class="tip-label">支付宝</p>
              <p class="tip-caption">支付宝扫一扫</p>
              <p class="tip-actions">
                <a class="btn btn--sm" href="{{ url_for('static', filename='images/alipay-qr.jpeg') }}" download="alipay-qr.jpeg">保存图片</a>
                <a class="btn btn--sm btn--quiet" href="{{ url_for('static', filename='images/alipay-qr.jpeg') }}" target="_blank" rel="noopener">看原图</a>
              </p>
            </div>
            <div class="col-12 col-sm-6 tip-pane tip-pane--wechat">
              <a class="tip-qr-link" href="{{ url_for('static', filename='images/wechat-qr.jpeg') }}" target="_blank" rel="noopener" aria-label="打开微信收款码原图">
                <img src="{{ url_for('static', filename='images/wechat-qr.jpeg') }}" class="tip-qr" alt="微信支付收款码"
                     width="387" height="387" loading="lazy" decoding="async">
              </a>
              <p class="tip-label">微信支付</p>
              <p class="tip-caption">微信扫一扫</p>
              <p class="tip-actions">
                <a class="btn btn--sm" href="{{ url_for('static', filename='images/wechat-qr.jpeg') }}" download="wechat-qr.jpeg">保存图片</a>
                <a class="btn btn--sm btn--quiet" href="{{ url_for('static', filename='images/wechat-qr.jpeg') }}" target="_blank" rel="noopener">看原图</a>
              </p>
            </div>
          </div>
        </div>
        <p class="tip-caption tip-hint">电脑可直接扫码；手机点「保存图片」存到相册，或长按图片保存，再到支付宝或微信的扫一扫里从相册选择。</p>
      </div>
    </div>
  </div>
</div>
