<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}每日机会{% endblock %}</title>
<meta name="description" content="{% block description %}沪深300 每日选股榜单与可转债榜单，按交易日查看，数据仅供参考。{% endblock %}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/date-filter.css') }}">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
{% include 'components/nav.html' %}
{% block body %}{% endblock %}
<footer class="app-footer">
<div class="container app-footer__inner">
<p class="app-footer__brand">&copy; {{ year }} 每日机会</p>
<p class="app-footer__note">沪深300 选股与可转债分析</p>
<p class="app-footer__note">数据仅供参考，不构成投资建议</p>
</div>
</footer>
{% include 'components/tip_modal.html' %}
<script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
<script>window.APP_MODE={{ app_mode|tojson }};window.DATA_PREFIX={{ data_prefix|tojson }};</script>
<script type="module" src="{{ url_for('static', filename='js/date-filter.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
