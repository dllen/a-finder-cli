<script>
(function(){
  var btn=document.getElementById('themeToggle');
  if(!btn)return;
  function current(){return document.documentElement.dataset.mode||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');}
  function update(){btn.setAttribute('aria-pressed',current()==='dark'?'true':'false');}
  btn.addEventListener('click',function(){
    var next=current()==='dark'?'light':'dark';
    document.documentElement.dataset.mode=next;
    localStorage.setItem('af-mode',next);
    update();
    window.dispatchEvent(new Event('af-mode-change'));
  });
  update();
})();
</script>
